[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connect-mcp"
version = "0.2.0"
description = "Private, read-only MCP bridge for the official Garmin Connect Personal API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.11,<3", "starlette>=0.49.1,<1", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
garmin-connect-mcp = "garmin_connect_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
