name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - name: Smoke-test isolated uv installation
        if: matrix.python == '3.11'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/garmin-uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/garmin-uv-bin
        run: |
          python -m pip install uv
          uv tool install --python 3.12 .
          "$UV_TOOL_BIN_DIR/garmin-connect-mcp" --version
          "$UV_TOOL_BIN_DIR/garmin-connect-mcp" client-config
          "$UV_TOOL_BIN_DIR/garmin-connect-mcp" client-config --format vscode
          "$UV_TOOL_BIN_DIR/garmin-connect-mcp" client-config --format codex
      - run: bash -n scripts/publish_github.sh scripts/tunnel_stdio.sh
      - run: python scripts/build_agensi_package.py --check
      - run: python scripts/build_agensi_package.py
      - name: Upload Agensi preparation bundle
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: agensi-launch-bundle
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/agensi/*.zip
            dist/agensi/*.sha256
            assets/icon.png
            docs/agensi/
